<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameNova — Play. Challenge. Conquer.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070d;
    --bg-alt:#0c0c16;
    --panel:rgba(255,255,255,.045);
    --panel-hi:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --violet:#8b5cf6;
    --violet-soft:#c4b5fd;
    --cyan:#22d3ee;
    --green:#39ff9a;
    --gold:#ffc857;
    --pink:#ff4d9e;
    --danger:#ff5470;
    --text:#eae8f7;
    --text-dim:#8b899e;
    --text-faint:#57546b;
    --font-display:'Orbitron',sans-serif;
    --font-body:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,.16), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(34,211,238,.12), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255,77,158,.08), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--violet);color:#fff;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  #matrixCanvas{position:fixed;inset:0;z-index:0;opacity:.35;}

  #landingScreen{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--bg);padding:50px 20px;overflow-y:auto;text-align:center;
  }
  .landing-inner{position:relative;z-index:2;max-width:960px;width:100%;}
  .brand-logo{
    font-family:var(--font-display);
    font-weight:900;
    letter-spacing:1px;
    text-align:center;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    cursor:default;
  }
  .landing-logo{font-size:clamp(34px,6vw,56px);}
  .landing-logo:hover{ animation:glitch .35s steps(2) 2; }
  @keyframes glitch{
    0%{ text-shadow:2px 0 var(--pink), -2px 0 var(--cyan); }
    50%{ text-shadow:-2px 0 var(--pink), 2px 0 var(--cyan); }
    100%{ text-shadow:none; }
  }
  .brand-tagline{
    text-align:center;font-size:13px;color:var(--text-dim);
    margin-top:10px;letter-spacing:3px;text-transform:uppercase;
    font-family:var(--font-mono);
  }
  .landing-badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .landing-badge{
    font-family:var(--font-mono);font-size:11px;color:var(--text-dim);
    background:var(--panel);border:1px solid var(--border);padding:6px 14px;border-radius:100px;
  }
  .landing-carousel{
    position:relative;width:100%;max-width:520px;margin:40px auto 16px;
    height:250px;overflow:hidden;border-radius:24px;border:1px solid var(--border);
  }
  .carousel-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);}
  .carousel-slide{
    min-width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--panel);padding:22px;
  }
  .carousel-slide::before{
    content:'';position:absolute;inset:0;opacity:.28;
    background:radial-gradient(circle at 50% 0%, var(--glow,var(--violet)), transparent 70%);
  }
  .carousel-slide[data-game="memory-hacker"]{--glow:var(--violet);}
  .carousel-slide[data-game="hacker-firewall"]{--glow:var(--green);}
  .carousel-slide[data-game="time-loop"]{--glow:var(--cyan);}
  .carousel-slide[data-game="plant-defender"]{--glow:#4ade80;}
  .carousel-slide[data-game="ai-maze"]{--glow:var(--pink);}
  .cs-icon{font-size:54px;position:relative;z-index:1;animation:csFloat 2.6s ease-in-out infinite;}
  @keyframes csFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .cs-title{font-weight:800;font-size:19px;position:relative;z-index:1;}
  .cs-desc{font-size:12px;color:var(--text-dim);max-width:380px;text-align:center;line-height:1.65;position:relative;z-index:1;}
  .carousel-dots{display:flex;gap:8px;justify-content:center;margin-bottom:28px;}
  .carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);border:none;transition:.25s;cursor:pointer;padding:0;}
  .carousel-dot.active{background:var(--violet);width:24px;border-radius:6px;}
  .btn-enter{
    padding:16px 44px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    color:#07070d;font-weight:800;font-size:15px;letter-spacing:.5px;
    box-shadow:0 14px 44px rgba(139,92,246,.4);transition:.2s;
  }
  .btn-enter:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 54px rgba(34,211,238,.5);}
  .landing-hint{margin-top:18px;font-size:11px;color:var(--text-faint);}

  /* ---- Login / Gmail verification panel ---- */
  .login-modal{
    max-width:360px;margin:0 auto;text-align:left;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;
    padding:26px 24px;backdrop-filter:blur(16px);
  }
  .login-modal .field{margin-bottom:14px;}
  .login-modal .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono);}
  .login-modal .field input{
    width:100%;padding:11px 14px;border-radius:10px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-family:var(--font-body);transition:.2s;
  }
  .login-modal .field input:focus{border-color:var(--cyan);background:rgba(34,211,238,.05);}
  .login-err{color:var(--danger);font-size:12px;margin-top:8px;min-height:14px;font-family:var(--font-mono);}
  .login-note{font-size:11px;color:var(--text-faint);margin-top:12px;line-height:1.5;}
  .btn-back{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:12px;}
  .otp-code-hint{font-family:var(--font-mono);font-size:13px;color:var(--gold);background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.25);padding:10px 12px;border-radius:10px;margin-bottom:14px;text-align:center;letter-spacing:2px;}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:13px;border-radius:12px;background:#fff;color:#1f1f1f;
    font-weight:600;font-size:14px;border:none;box-shadow:0 10px 28px rgba(0,0,0,.3);transition:.2s;
  }
  .google-btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,.4);}
  .google-btn:disabled{opacity:.6;cursor:default;transform:none;}

  #app{display:none;min-height:100vh;}
  #app.show{display:flex;}

  .sidebar{
    width:230px;flex-shrink:0;
    background:rgba(10,10,18,.6);
    border-right:1px solid var(--border);
    backdrop-filter:blur(16px);
    display:flex;flex-direction:column;
    padding:24px 16px;
    position:sticky;top:0;height:100vh;
  }
  .sidebar-logo{font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:1px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
    padding:0 10px 22px;cursor:pointer;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:12px;
    color:var(--text-dim);font-size:14px;font-weight:500;
    margin-bottom:4px;border:1px solid transparent;
    background:transparent;width:100%;text-align:left;
    transition:.15s;
  }
  .nav-item .ic{width:18px;text-align:center;flex-shrink:0;}
  .nav-item:hover{background:var(--panel);color:var(--text);}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.1));
    border-color:rgba(139,92,246,.3);color:#fff;
  }
  .sidebar-bottom{margin-top:auto;}
  .logout-btn{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-size:13px;width:100%;
  }
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}

  .main{flex:1;padding:28px 36px 60px;max-width:1200px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .topbar-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.5px;}
  .topbar-user{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);padding:7px 14px 7px 7px;border-radius:100px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .coins{font-family:var(--font-mono);font-size:12px;color:var(--gold);}

  .page{display:none;}
  .page.active{display:block;animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .hero-panel{
    position:relative;overflow:hidden;
    border-radius:22px;border:1px solid var(--border);
    background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(34,211,238,.06));
    padding:34px 32px;margin-bottom:26px;
  }
  .hero-panel::after{
    content:'';position:absolute;top:-40%;right:-10%;width:300px;height:300px;
    background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%);
    filter:blur(10px);
  }
  .hero-welcome{font-size:24px;font-weight:700;position:relative;z-index:1;}
  .hero-sub{color:var(--text-dim);font-size:13px;margin-top:6px;position:relative;z-index:1;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px;position:relative;z-index:1;}
  .stat-box{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .stat-box .num{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--cyan);}
  .stat-box .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

  .quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px;}
  .quick-btn{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    transition:.2s;color:var(--text);
  }
  .quick-btn:hover{border-color:var(--violet);transform:translateY(-2px);background:var(--panel-hi);}
  .quick-btn .qb-icon{font-size:20px;}
  .quick-btn .qb-title{font-weight:700;font-size:14px;}
  .quick-btn .qb-sub{font-size:11px;color:var(--text-dim);}

  .section-title{font-family:var(--font-display);font-size:15px;letter-spacing:1px;margin:8px 0 16px;color:var(--text);}
  .section-title span{color:var(--text-dim);font-family:var(--font-body);font-weight:400;font-size:12px;}

  .portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;}
  .portal-card{
    position:relative;border-radius:18px;padding:22px 20px 20px;
    background:var(--panel);border:1px solid var(--border);
    overflow:hidden;transition:.25s;
  }
  .portal-card:hover{transform:translateY(-4px);}
  .portal-card::before{
    content:'';position:absolute;inset:0;opacity:0;transition:.25s;
    background:radial-gradient(circle at 30% 0%, var(--glow,var(--violet)), transparent 65%);
  }
  .portal-card:hover::before{opacity:.22;}
  .portal-icon{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    margin-bottom:14px;position:relative;z-index:1;
  }
  .portal-card[data-game="memory-hacker"]{--glow:var(--violet);}
  .portal-card[data-game="hacker-firewall"]{--glow:var(--green);}
  .portal-card[data-game="time-loop"]{--glow:var(--cyan);}
  .portal-card[data-game="plant-defender"]{--glow:#4ade80;}
  .portal-card[data-game="ai-maze"]{--glow:var(--pink);}
  .portal-title{font-weight:700;font-size:15px;position:relative;z-index:1;}
  .portal-desc{font-size:12px;color:var(--text-dim);margin:6px 0 16px;line-height:1.5;position:relative;z-index:1;}
  .portal-status{
    display:inline-block;font-size:10px;font-family:var(--font-mono);
    padding:3px 9px;border-radius:100px;letter-spacing:.5px;
    background:rgba(57,255,154,.12);color:var(--green);border:1px solid rgba(57,255,154,.25);
    margin-bottom:12px;
  }
  .portal-play{
    position:relative;z-index:1;width:100%;padding:9px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:600;transition:.2s;
  }
  .portal-play:hover{background:var(--glow,var(--violet));color:#07070d;border-color:transparent;}

  .lb-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .lb-tab{padding:8px 16px;border-radius:100px;background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-size:12px;font-weight:600;}
  .lb-tab.active{background:var(--violet);color:#fff;border-color:transparent;}
  .lb-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .lb-table th{text-align:left;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;}
  .lb-table td{padding:13px 18px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);}
  .lb-table tr:last-child td{border-bottom:none;}
  .lb-rank{font-family:var(--font-mono);font-weight:700;color:var(--text-dim);}
  .lb-rank.gold{color:var(--gold);} .lb-rank.silver{color:#c9c9d6;} .lb-rank.bronze{color:#d08a52;}
  .lb-name{font-weight:600;display:flex;align-items:center;gap:9px;}
  .lb-name .mini-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
  .lb-score{font-family:var(--font-mono);color:var(--cyan);font-weight:600;}
  .you-row td{background:rgba(139,92,246,.08);}

  .ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .ach-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start;transition:.2s;}
  .ach-card.locked{opacity:.4;filter:grayscale(.6);}
  .ach-card.unlocked{border-color:rgba(255,200,87,.35);}
  .ach-icon{font-size:26px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ach-title{font-weight:700;font-size:13px;}
  .ach-desc{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .ach-progress{font-family:var(--font-mono);font-size:10px;color:var(--gold);margin-top:6px;}

  .profile-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px;display:flex;gap:20px;align-items:center;margin-bottom:24px;}
  .profile-avatar{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;flex-shrink:0;}
  .profile-name{font-size:19px;font-weight:700;}
  .profile-meta{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);margin-top:4px;}
  .per-game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .per-game-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .per-game-box .pg-name{font-size:12px;font-weight:600;color:var(--text-dim);}
  .per-game-box .pg-score{font-family:var(--font-mono);font-size:18px;color:var(--violet-soft);margin-top:4px;}

  .settings-list{max-width:480px;display:flex;flex-direction:column;gap:12px;}
  .setting-row{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
  .setting-label{font-size:13px;font-weight:600;}
  .setting-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .toggle{width:44px;height:24px;border-radius:100px;background:rgba(255,255,255,.1);border:1px solid var(--border);position:relative;flex-shrink:0;transition:.2s;}
  .toggle.on{background:var(--violet);}
  .toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;}
  .toggle.on::after{left:22px;}
  .select-pill{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:9px;font-size:12px;font-family:var(--font-mono);}

  #toastWrap{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:rgba(15,15,25,.9);border:1px solid var(--border);backdrop-filter:blur(12px);
    padding:13px 18px;border-radius:12px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:toastIn .3s ease;max-width:280px;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

  @media(max-width:820px){
    .sidebar{position:fixed;left:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;
      justify-content:space-around;padding:10px;border-right:none;border-top:1px solid var(--border);z-index:40;}
    .sidebar-logo,.logout-btn,.sidebar-bottom{display:none;}
    .nav-item{flex-direction:column;gap:3px;font-size:9px;padding:8px 6px;}
    .nav-item span.lbl-txt{display:none;}
    #app.show{display:block;}
    .main{padding:20px 16px 90px;max-width:100%;}
    .topbar-title{font-size:17px;}
  }
  /* ---------------- BOOT LOADING SCREEN ---------------- */
  #loadingScreen{
    position:fixed;inset:0;z-index:100;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loadingScreen.fade-out{opacity:0;visibility:hidden;pointer-events:none;}
  .boot-logo{
    font-family:var(--font-display);font-weight:900;font-size:clamp(32px,7vw,50px);letter-spacing:2px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:bootPulse 1.4s ease-in-out infinite;
  }
  @keyframes bootPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.65;transform:scale(.97);}}
  .boot-ring{
    width:64px;height:64px;border-radius:50%;
    border:3px solid rgba(139,92,246,.15);
    border-top-color:var(--violet);border-right-color:var(--cyan);
    animation:bootSpin 1s linear infinite;
  }
  @keyframes bootSpin{to{transform:rotate(360deg);}}
  .boot-status{
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    letter-spacing:1px;min-height:16px;
  }
  .boot-bar-track{width:220px;height:4px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden;}
  .boot-bar-fill{height:100%;width:0%;border-radius:100px;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .3s ease;}
  .game-overlay{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;}
  .game-overlay.show{display:flex;}
  .game-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(10,10,18,.7);backdrop-filter:blur(10px);flex-wrap:wrap;gap:8px;}
  .game-exit{background:var(--panel);border:1px solid var(--border);col
